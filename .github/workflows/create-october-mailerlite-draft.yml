name: Create October MailerLite Draft

on:
  push:
    branches:
      - codex-october-mailerlite-draft-20260929

permissions:
  contents: read

jobs:
  create-draft:
    runs-on: ubuntu-latest
    env:
      MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Create draft campaign only
        shell: python
        run: |
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          api_key = os.environ.get("MAILERLITE_API_KEY", "").strip()
          if not api_key:
              raise SystemExit("MAILERLITE_API_KEY is not configured")

          html = Path("drafts/the-apogee-ascent-october-2026.html").read_text(encoding="utf-8")
          html = html.replace(
              "file:///var/folders/8l/xvpy47n508q79ycgb5_y58gm0000gn/T/codex-clipboard-da0708b5-aa00-4715-b0fd-506ed4dfaf00.png",
              "https://raw.githubusercontent.com/apogeecollegeprep/newsletter/codex-october-mailerlite-draft-20260929/assets/maddie-c.jpg",
          )
          html = html.replace(
              '<a class="button" href="#">Sign up for the newsletter</a>',
              '<a class="button" href="https://preview.mailerlite.io/forms/2569796/196787770816988233/share">Sign up for the newsletter</a>',
          )
          html = html.replace(
              "Atlanta, GA 30310</p>",
              'Atlanta, GA 30310<br>United States</p><p><a href="{$unsubscribe}" style="color:#f9ad0b">Unsubscribe or update preferences</a></p>',
          )

          payload = {
              "name": "The Apogee Ascent - October 2026 Draft",
              "type": "regular",
              "emails": [{
                  "subject": "The Apogee Ascent - October 2026",
                  "from_name": "Apogee College Prep",
                  "from": "adam@apogeecollegeprep.com",
                  "content": html,
              }],
          }

          request = urllib.request.Request(
              "https://connect.mailerlite.com/api/campaigns",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {api_key}",
                  "Content-Type": "application/json",
                  "Accept": "application/json",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.load(response)
          except urllib.error.HTTPError as error:
              detail = error.read().decode("utf-8", errors="replace")
              raise SystemExit(f"MailerLite create-draft request failed ({error.code}): {detail}")

          campaign = result.get("data", {})
          status = campaign.get("status")
          if status != "draft":
              raise SystemExit(f"Expected MailerLite draft status, received {status!r}")

          print(json.dumps({
              "campaign_id": campaign.get("id"),
              "status": status,
              "name": campaign.get("name"),
          }))

          # Safety invariant: this workflow intentionally contains no schedule or send request.
