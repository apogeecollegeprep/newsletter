name: Heartbeat news scan

on:
  push:
    branches:
      - codex-october-mailerlite-draft-20260929

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      INOREADER_CLIENT_ID: ${{ secrets.INOREADER_CLIENT_ID }}
      INOREADER_CLIENT_SECRET: ${{ secrets.INOREADER_CLIENT_SECRET }}
      INOREADER_REFRESH_TOKEN: ${{ secrets.INOREADER_REFRESH_TOKEN }}
      INOREADER_STREAM_ID: user/-/label/Apogee Newsletter
      LOOKBACK_HOURS: "28"
      MAX_INOREADER_ITEMS: "500"
    steps:
      - uses: actions/checkout@v4
      - name: Scan without writing
        run: |
          PYTHONPATH=src python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime, timedelta
          from apogee_newsletter.sync import (
              AirtableClient,
              InoreaderClient,
              RetryingSession,
              candidate_from_item,
              canonicalize_url,
              southeast_school_priority,
          )

          http = RetryingSession()
          airtable = AirtableClient(http)
          inoreader = InoreaderClient(http)
          sources = airtable.active_sources()
          items = inoreader.get_items(os.environ["INOREADER_STREAM_ID"], 28, 500)
          existing = airtable.existing_urls()
          cutoff = datetime.now(UTC) - timedelta(hours=28)
          candidates = []
          seen = set(existing)
          for item in items:
              candidate = candidate_from_item(item, sources)
              if candidate and datetime.fromisoformat(candidate.published_at) >= cutoff and candidate.url not in seen:
                  candidates.append(candidate)
                  seen.add(candidate.url)
          candidates.sort(
              key=lambda c: (
                  c.relevance_score,
                  southeast_school_priority(c.headline, c.source, c.url),
                  c.source_quality,
                  c.published_at,
              ),
              reverse=True,
          )
          print("SCAN_RESULT=" + json.dumps({
              "items_read": len(items),
              "active_sources": len(sources),
              "candidates": [c.__dict__ for c in candidates[:20]],
          }, ensure_ascii=False))
          PY
