name: Send weekly admissions brief

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-admissions-brief
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install .
      - name: Send five-story brief
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE }}
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
          AIRTABLE_BASE_ID: appjM2J9lAfpLyfd7
          AIRTABLE_CANDIDATES_TABLE_ID: tblZkI1A7D0Mgz98Y
          AIRTABLE_ISSUES_TABLE_ID: tblsnPXpizZA9SVfO
          MAILERLITE_WEEKLY_GROUP_NAME: Weekly Admissions Brief Test
          MAILERLITE_FROM_EMAIL: adam@apogeecollegeprep.com
          MAILERLITE_FROM_NAME: Apogee College Prep
        run: send-weekly-brief
